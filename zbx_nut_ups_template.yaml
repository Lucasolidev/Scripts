zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: 324501c326994c579efd95e34a2aeaf8
    template: Template Nobreak APC UPS NUT
    name: Template Nobreak APC UPS NUT (Zabbix Agent)
    groups:
    - name: Templates
    items:
    - uuid: 621b88c5f2d24891a185a16f28117a8e
      name: Contact
      key: nut.get[{$UPS_NAME},ups.mfr]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: CONTACT
      tags:
      - tag: Application
        value: System
    - uuid: a989578e64c24f81807b2b02e58fa6a5
      name: Software version (full)
      key: nut.get[{$UPS_NAME},driver.version]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: OS_FULL
      tags:
      - tag: Application
        value: System
    - uuid: bea8d8f5f47241f3841424935a3aa1af
      name: Device Location
      key: nut.get[{$UPS_NAME},device.type]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: LOCATION
      tags:
      - tag: Application
        value: System
    - uuid: db26a4184cd849a3b8a101292e14763e
      name: Device Name
      key: nut.get[{$UPS_NAME},ups.model]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      description: 'Bkp

        SNMPv2-MIB::sysName.0

        '
      inventory_link: NAME
      tags:
      - tag: Application
        value: System
    - uuid: 21a113f585654f3595f9299ab4d498e7
      name: System Uptime
      key: system.uptime
      history: 7d
      trends: 180d
      units: uptime
      description: 'Bkp

        SNMPv2-MIB::sysUpTime.0

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Status
    - uuid: c491765bc2674f36a04ab27fb5b1d07a
      name: UPS battery capacity (%)
      key: nut.get[{$UPS_NAME},battery.charge]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: '%'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: f4b80a0d504649cf9899ac7f50668ed5
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvBatteryCapacity)<90
        name: Batery Capacity <90%
        priority: AVERAGE
    - uuid: 6f98b6e43d7f4b42acca3d2e34b80b29
      name: UPS batery packst
      key: nut.get[{$UPS_NAME},battery.packs]
      delay: 1h
      history: 7d
      trends: 180d
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
    - uuid: cc73bfcf399d41aeb760c259d9ce6ad8
      name: UPS battery temperature
      key: nut.get[{$UPS_NAME},battery.temperature]
      history: 7d
      trends: 180d
      units: °C
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 00fe5f37736841168a0cf29c1d9c6c1b
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvBatteryTemperature)>40
        name: High battery temperature
        priority: HIGH
    - uuid: 73428395289e4ef790992922a3629a71
      name: UPS battery voltage
      key: nut.get[{$UPS_NAME},battery.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 8fc3ef9172924619a0d78ba3faa3d182
      name: Software version
      key: nut.get[{$UPS_NAME},ups.firmware]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: OS
      tags:
      - tag: Application
        value: System
    - uuid: 8ccd4167643148ec81873a9e1d22fca1
      name: Device Serial Number
      key: nut.get[{$UPS_NAME},device.serial]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: SERIALNO_A
      tags:
      - tag: Application
        value: System
    - uuid: 2b86fd562e5e4f01b3fee76d936f475c
      name: UPS input frequency
      key: nut.get[{$UPS_NAME},input.frequency]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: Hz
      tags:
      - tag: Application
        value: Power
    - uuid: 2ca794bf4b5d4852b1ea1adeeba3f941
      name: UPS input voltage
      key: nut.get[{$UPS_NAME},input.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 5c4d06ee4f3040839131067b71ff1bc9
      name: UPS current load (Amps)
      key: nut.load_amps[{$UPS_NAME},{$UPS_NOMINAL_POWER}]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: amp
      tags:
      - tag: Application
        value: Power
    - uuid: c0e1af6ac97440ecbaecf9ffc4cfd2f0
      name: UPS output frequency
      key: nut.get[{$UPS_NAME},output.frequency]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: Hz
      tags:
      - tag: Application
        value: Power
    - uuid: f69af51858a543da9f68e6f6c7fb438d
      name: UPS output load (%)
      key: nut.get[{$UPS_NAME},ups.load]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: '%'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 467aca2f9bfa42a5929274a4fb0e0764
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvOutputLoad)>85
        name: Output Load Critical >85%
        priority: HIGH
      - uuid: 3c7495f90f8148e3abb87242cea5f6fd
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvOutputLoad)>90
        name: Output load High
        priority: WARNING
    - uuid: a71140ee11df4ad589413d3831e5f4d3
      name: UPS output load (W)
      key: nut.power_watts[{$UPS_NAME},{$UPS_NOMINAL_POWER}]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: W
      params: last(//upsAdvOutputVoltage) * last(//upsAdvOutputCurrent)
      tags:
      - tag: Application
        value: Power
    - uuid: 04458169bfcf41769d6b9f743a78f1a3
      name: UPS output voltage
      key: nut.get[{$UPS_NAME},output.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: aacaee83c21b4cbe941df2c527d9b032
      name: UPS replace battery indicator
      key: nut.battery_status_code[{$UPS_NAME}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcBatteryReplacementStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 65d9f190d159406199cf68d8ffa44811
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvReplaceBatteryIndicator)<>1
        name: Battery Needs Replaced
        priority: AVERAGE
    - uuid: 0b68a0ad3e85443fa601cb7d84c3578a
      name: UPS battery time remaining
      key: nut.get[{$UPS_NAME},battery.runtime]
      history: 7d
      trends: 180d
      units: s
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 582608a242844da78ded1ee817ae2787
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvRunTimeRemaining)<20
        name: Batery Time Remaining <20min
        priority: HIGH
      - uuid: 048b7e84e5494b3286a7cf934abe4add
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvRunTimeRemaining)<10
        name: Run time remaining CRITICAL
        priority: DISASTER
    - uuid: 62a2970a0dfe44229d4456791a2f7eb9
      name: UPS battery status
      key: nut.battery_status_code[{$UPS_NAME}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcBatteryStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 68e94591eb0d4b2eae3a2339b1547223
        expression: last(/Template Nobreak APC UPS SNMP/upsBasicBatteryStatus)=3
        name: The battery power is too low to support the load
        priority: AVERAGE
    - uuid: 78d3fc384de7414d94819606b61ac2f5
      name: UPS Time on Battery
      key: nut.get[{$UPS_NAME},battery.time_on_battery]
      history: 7d
      trends: 180d
      units: s
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
    - uuid: 707426b3be85445698718d0b34e3e8e0
      name: Device Model Name
      key: nut.get[{$UPS_NAME},device.model]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: TYPE
      tags:
      - tag: Application
        value: System
    - uuid: fe2a37acd8064e1db745c8119fb41a2d
      name: UPS status
      key: nut.ups_status_code[{$UPS_NAME}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 1dd8b23a2dd64364b6b93b7d7bbb381b
        expression: last(/Template Nobreak APC UPS SNMP/upsBasicOutputStatus)<>2
        name: Nobreak Status
        priority: AVERAGE
    valuemaps:
    - uuid: 3994693056ff4c10a776e44e6b203889
      name: apcBatteryReplacementStatus
      mappings:
      - value: '1'
        newvalue: noBatteryNeedsReplacing
      - value: '2'
        newvalue: batteryNeedsReplacing
    - uuid: 3eab5eb2e2094903993aa29c56890314
      name: apcBatteryStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: batteryNormal
      - value: '3'
        newvalue: batteryLow
    - uuid: 0fcdc8d8475c403295e49e427ef28f7c
      name: apcStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: onLine
      - value: '3'
        newvalue: onBattery
      - value: '4'
        newvalue: onSmartBoost
      - value: '5'
        newvalue: timedSleeping
      - value: '6'
        newvalue: softwareBypass
      - value: '7'
        newvalue: 'off'
      - value: '8'
        newvalue: rebooting
      - value: '9'
        newvalue: switchedBypass
      - value: '10'
        newvalue: harwareFailureBypass
      - value: '11'
        newvalue: sleepingUnitPowerReturn
      - value: '12'
        newvalue: onSmartTrim
      - value: '13'
        newvalue: ecoMode
      - value: '14'
        newvalue: hotStandby
      - value: '15'
        newvalue: onBatteryTest
    description: Monitoramento universal de nobreaks APC e compativeis com NUT via Zabbix Agent 7.0.
    macros:
    - macro: '{$UPS_NAME}'
      value: Cliente_Nobreak
      description: Nome do nobreak configurado no /etc/nut/ups.conf
    - macro: '{$UPS_NOMINAL_POWER}'
      value: '2200'
      description: Potencia nominal do nobreak em Watts
  triggers:
  - uuid: 5f0e3a4909d1428ea608d148bb9e50ed
    expression: 'last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.time_on_battery])>0

      and

      last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.runtime])>=0

      '
    name: Nobreak on Battery
    opdata: 'Operando: {ITEM.LASTVALUE1}  |  Restante: {ITEM.LASTVALUE2}'
    priority: HIGH
    description: "Operando: {ITEM.LASTVALUE1} \nRestante: {ITEM.LASTVALUE2}\n"
  graphs:
  - uuid: eb13142a688440b797fc8a9579c23d46
    name: Battery status
    ymin_type_1: FIXED
    graph_items:
    - drawtype: BOLD_LINE
      color: C80000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.battery_status_code[{$UPS_NAME}]
    - sortorder: '1'
      drawtype: BOLD_LINE
      color: 00C800
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.battery_status_code[{$UPS_NAME}]
  - uuid: 977b87a1d39444dba29f0a2fd4ef4413
    name: UPS Capacity
    ymin_type_1: FIXED
    graph_items:
    - sortorder: '1'
      drawtype: FILLED_REGION
      color: 4CAF50
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},battery.charge]
    - sortorder: '2'
      drawtype: BOLD_LINE
      color: CC0000
      yaxisside: RIGHT
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},battery.runtime]
  - uuid: 30ddbd9e8890470ea8e69ae124080049
    name: UPS load
    graph_items:
    - color: C80000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.load_amps[{$UPS_NAME},{$UPS_NOMINAL_POWER}]
    - sortorder: '1'
      color: 0000CC
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},ups.load]
  - uuid: 258b51ba0985423fbeb732998282be0c
    name: UPS temperature
    ymin_type_1: FIXED
    graph_items:
    - drawtype: GRADIENT_LINE
      color: '660000'
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},battery.temperature]
  - uuid: fccd273a82ec47b3b1519e8082506298
    name: UPS voltage
    graph_items:
    - color: 0000CC
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},output.voltage]
    - sortorder: '1'
      color: CC0000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},input.voltage]
