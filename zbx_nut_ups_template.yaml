zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: c3c5480217de46acb1cd4e924692058b
      name: 'Templates/Power'
  templates:
    - uuid: 300f3d87d4ae420fb7f628d4edae790a
      template: 'APC and Universal UPS by NUT'
      name: 'APC and Universal UPS by NUT (Zabbix Agent)'
      description: |
        Template para monitoramento de nobreaks APC (Smart-UPS SMC2200BI-BR e outros) e qualquer fabricante compatível com o NUT (Network UPS Tools) via Zabbix Agent 7.0.
        
        Permite a coleta de todas as 27 métricas elétricas e de status diretamente via cabo USB.
      groups:
        - name: 'Templates/Power'
      items:
        - uuid: 5c0e5cf575944ebb9c519490bdb2d09a
          name: 'Device Model Name'
          key: 'nut.get[{$UPS_NAME},ups.model]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Modelo de identificação do nobreak.'
          tags:
            - tag: Application
              value: System
        - uuid: f0145b02dcd644278654479477f1521e
          name: 'Device Manufacturer'
          key: 'nut.get[{$UPS_NAME},ups.mfr]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Fabricante do equipamento.'
          tags:
            - tag: Application
              value: System
        - uuid: 855241deca674642a8f7997d0ad01a67
          name: 'Device Serial Number'
          key: 'nut.get[{$UPS_NAME},ups.serial]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Número de série do nobreak.'
          tags:
            - tag: Application
              value: System
        - uuid: 142420646b8f4b69a69dcf583f91bfea
          name: 'Software version'
          key: 'nut.get[{$UPS_NAME},ups.firmware]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Versão do firmware do equipamento.'
          tags:
            - tag: Application
              value: System
        - uuid: f8d4ab1e119544e1ac8d131dad1efa76
          name: 'UPS battery capacity (%)'
          key: 'nut.get[{$UPS_NAME},battery.charge]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Capacidade de carga atual da bateria em porcentagem.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: b47a326264b442709242c94e04f8618f
              expression: 'last(/APC and Universal UPS by NUT/nut.get[{$UPS_NAME},battery.charge]) < 20'
              name: 'Nobreak ({$UPS_NAME}): Bateria em Nível Crítico (< 20%)'
              priority: HIGH
              description: 'A bateria do nobreak está abaixo de 20% de capacidade.'
            - uuid: 70cd29248c7544b49f821be87136b093
              expression: 'last(/APC and Universal UPS by NUT/nut.get[{$UPS_NAME},battery.charge]) < 10'
              name: 'Nobreak ({$UPS_NAME}): Bateria Esgotando (< 10%)'
              priority: DISASTER
              description: 'A bateria do nobreak está prestes a se esgotar completamente.'
        - uuid: 11b39bdd94fa4fe9bb47e45085e75718
          name: 'UPS battery status'
          key: 'nut.battery_status_code[{$UPS_NAME}]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          valuemap:
            name: 'APC Battery Status'
          description: 'Status operacional do banco de baterias.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 4c871126ac144e0fa4b659467cfd08c9
              expression: 'last(/APC and Universal UPS by NUT/nut.battery_status_code[{$UPS_NAME}]) = 3'
              name: 'Nobreak ({$UPS_NAME}): Alerta de Bateria Baixa'
              priority: AVERAGE
            - uuid: d798f86f2e1842cb9a7caf15ea3c76f1
              expression: 'last(/APC and Universal UPS by NUT/nut.battery_status_code[{$UPS_NAME}]) = 4'
              name: 'Nobreak ({$UPS_NAME}): Necessária Substituição da Bateria'
              priority: HIGH
        - uuid: 3b163413891849a98e5a307fe2a4bfc7
          name: 'UPS battery temperature'
          key: 'nut.get[{$UPS_NAME},battery.temperature]'
          delay: 1m
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '°C'
          description: 'Temperatura interna do banco de baterias.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: f3ed58cd669a49ae983a2e6915c5cb1e
              expression: 'min(/APC and Universal UPS by NUT/nut.get[{$UPS_NAME},battery.temperature],5m) > 42'
              name: 'Nobreak ({$UPS_NAME}): Alta Temperatura na Bateria (> 42°C)'
              priority: WARNING
        - uuid: cc854d27daea4290af57443b654a6494
          name: 'UPS battery time remaining'
          key: 'nut.get[{$UPS_NAME},battery.runtime]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          units: 's'
          description: 'Tempo estimado de autonomia restante em segundos.'
          tags:
            - tag: Application
              value: Power
        - uuid: 450401dceec744b4a62ae22ce67678f1
          name: 'UPS battery voltage'
          key: 'nut.get[{$UPS_NAME},battery.voltage]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão do banco de baterias em Volts.'
          tags:
            - tag: Application
              value: Power
        - uuid: db576c52e4c14d50857266347dd18efb
          name: 'UPS current load (Amps)'
          key: 'nut.load_amps[{$UPS_NAME},{$UPS_NOMINAL_POWER}]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'A'
          description: 'Corrente de saída consumida em Amperes.'
          tags:
            - tag: Application
              value: Power
        - uuid: 9924d9af113346a298f0722a835af9a7
          name: 'UPS input frequency'
          key: 'nut.get[{$UPS_NAME},input.frequency]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'Hz'
          description: 'Frequência da rede elétrica de entrada em Hertz.'
          tags:
            - tag: Application
              value: Power
        - uuid: e9f174a5dc2d407fa2ff7a4c783876f9
          name: 'UPS input voltage'
          key: 'nut.get[{$UPS_NAME},input.voltage]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão da rede elétrica de entrada em Volts.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 039a3a8030bd4710ae47183cb7ed905c
              expression: 'last(/APC and Universal UPS by NUT/nut.get[{$UPS_NAME},input.voltage]) < 90 and last(/APC and Universal UPS by NUT/nut.ups_status_code[{$UPS_NAME}]) = 3'
              name: 'Nobreak ({$UPS_NAME}): Falta de Energia da Concessionária (Operando em Bateria)'
              priority: HIGH
              description: 'A rede elétrica de entrada caiu e o nobreak está alimentando os servidores pelas baterias.'
        - uuid: b2d24e05851b4ca9a4c99dfc469da98d
          name: 'UPS output frequency'
          key: 'nut.get[{$UPS_NAME},output.frequency]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'Hz'
          description: 'Frequência da rede elétrica de saída.'
          tags:
            - tag: Application
              value: Power
        - uuid: 189d4012fac849059e1bfbb2aa96b6ba
          name: 'UPS output load (%)'
          key: 'nut.get[{$UPS_NAME},ups.load]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '%'
          description: 'Porcentagem de carga consumida em relação à capacidade máxima do nobreak.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 80f8628c9eaf47b2ba0928856751bfb6
              expression: 'min(/APC and Universal UPS by NUT/nut.get[{$UPS_NAME},ups.load],3m) > 85'
              name: 'Nobreak ({$UPS_NAME}): Sobrecarga de Saída (> 85%)'
              priority: WARNING
            - uuid: 733eacf1cb2f4d578746eae9f361aa3d
              expression: 'min(/APC and Universal UPS by NUT/nut.get[{$UPS_NAME},ups.load],1m) > 95'
              name: 'Nobreak ({$UPS_NAME}): Sobrecarga Crítica de Saída (> 95%)'
              priority: HIGH
        - uuid: c1b1998be3fd4bb3b9b091c108cf6430
          name: 'UPS output load (W)'
          key: 'nut.power_watts[{$UPS_NAME},{$UPS_NOMINAL_POWER}]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'W'
          description: 'Potência real consumida pelas cargas conectadas em Watts.'
          tags:
            - tag: Application
              value: Power
        - uuid: 2903c68e0bcc4441936a599d7ecd11e8
          name: 'UPS output voltage'
          key: 'nut.get[{$UPS_NAME},output.voltage]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão fornecida nas tomadas de saída do nobreak.'
          tags:
            - tag: Application
              value: Power
        - uuid: 3a8246b6e1964390a0e118983611367d
          name: 'UPS status'
          key: 'nut.ups_status_code[{$UPS_NAME}]'
          delay: 30s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          valuemap:
            name: 'APC UPS Status'
          description: 'Código de status operacional do nobreak.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: b4ceded6d2374a79adc93e3748373760
              expression: 'last(/APC and Universal UPS by NUT/nut.ups_status_code[{$UPS_NAME}]) = 3'
              name: 'Nobreak ({$UPS_NAME}): Operando em Bateria (onBattery)'
              priority: AVERAGE
              description: 'O nobreak entrou em modo de bateria devido à oscilação ou corte de energia.'
        - uuid: 79c094542a2840f49633aeac19c75980
          name: 'UPS status (raw)'
          key: 'nut.get[{$UPS_NAME},ups.status]'
          delay: 30s
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'String bruta de status reportada pelo driver (ex: OL, OB, LB, CHRG).'
          tags:
            - tag: Application
              value: Status
      macros:
        - macro: '{$UPS_NAME}'
          value: 'Cliente_Nobreak'
          description: 'Nome do nobreak configurado no /etc/nut/ups.conf'
        - macro: '{$UPS_NOMINAL_POWER}'
          value: '2200'
          description: 'Potência nominal do nobreak em Watts'
      valuemaps:
        - uuid: ef25b478adf84396af34528c59175040
          name: 'APC Battery Status'
          mappings:
            - value: '1'
              newvalue: 'unknown (1)'
            - value: '2'
              newvalue: 'batteryNormal (2)'
            - value: '3'
              newvalue: 'batteryLow (3)'
            - value: '4'
              newvalue: 'batteryInFault (4)'
        - uuid: f3be6fed7e324613b37dbd6f4b354f77
          name: 'APC UPS Status'
          mappings:
            - value: '1'
              newvalue: 'unknown (1)'
            - value: '2'
              newvalue: 'onLine (2)'
            - value: '3'
              newvalue: 'onBattery (3)'
            - value: '4'
              newvalue: 'onBoost (4)'
            - value: '5'
              newvalue: 'sleeping (5)'
            - value: '6'
              newvalue: 'onBypass (6)'
            - value: '7'
              newvalue: 'rebooting (7)'
