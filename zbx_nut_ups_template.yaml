zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 10c88dfc48564d5292e5cba005de30b9
      template: 'Template Nobreak UPS NUT'
      name: 'Template Nobreak UPS NUT (Zabbix Agent)'
      groups:
        - name: Templates
      items:
        - uuid: 2cc8b43cfeb7429788f6fe3894c8d7bd
          name: 'UPS Fabricante'
          key: 'nut.get[{$UPS_NAME},device.mfr]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: bb4167a492a64090aae98ecb72d1b7f4
          name: 'UPS Driver Versão'
          key: 'nut.get[{$UPS_NAME},driver.version]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: 68f6c06648424374b489224a144dc175
          name: 'UPS Tipo de Dispositivo'
          key: 'nut.get[{$UPS_NAME},device.type]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: c7b22775bc7e4db2a0cc62d0235c4a14
          name: 'UPS Modelo'
          key: 'nut.get[{$UPS_NAME},device.model]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: 9bb0079b79f448c6900e570f37e7a429
          name: 'UPS Número de Série'
          key: 'nut.get[{$UPS_NAME},device.serial]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: 69e95e8d71bf44cbb188c077b6da59fe
          name: 'UPS Firmware Versão'
          key: 'nut.get[{$UPS_NAME},ups.firmware]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: 0ea4bd016bc84d42b17b85022d4d1310
          name: 'UPS Data de Fabricação'
          key: 'nut.get[{$UPS_NAME},ups.mfr.date]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: c0cdc21cfa1048dab815fa5b61222b8f
          name: 'UPS Alarme Sonoro (Beeper)'
          key: 'nut.get[{$UPS_NAME},ups.beeper.status]'
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: 6c8cc6c1b683454eadcba439aa7869a6
          name: 'UPS Tempo de Atividade (Uptime)'
          key: 'nut.uptime[{$UPS_NAME}]'
          history: 7d
          trends: 180d
          units: uptime
          tags:
            - tag: Application
              value: Status
        - uuid: 6298635faaf946959721e34a6ad25d0b
          name: 'UPS Status Operacional'
          key: 'nut.ups_status_code[{$UPS_NAME}]'
          history: 7d
          trends: 180d
          valuemap:
            name: upsStatus
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 8e9093235d6c4864bb318cccf21e442f
              expression: 'last(/Template Nobreak UPS NUT/nut.ups_status_code[{$UPS_NAME}])<>2'
              name: 'UPS Status Operacional Anormal'
              priority: AVERAGE
        - uuid: 243b3f5bdab947fcb207e963013e94bf
          name: 'UPS Modo de Operação (Rede / Bateria)'
          key: 'nut.get[{$UPS_NAME},ups.status]'
          history: 7d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var map = {
                      'OL': 'Operando na Rede Elétrica (Online)',
                      'OB': 'Operando na Bateria (Falta de Energia)',
                      'LB': 'Bateria em Nível Baixo (Crítico)',
                      'RB': 'Bateria Requer Substituição',
                      'CHRG': 'Carregando Bateria',
                      'DISCHRG': 'Descarregando Bateria',
                      'BYPASS': 'Modo Bypass Ativo',
                      'CAL': 'Em Calibração de Bateria',
                      'OFF': 'Nobreak Desligado',
                      'OVER': 'Sobrecarga Detectada',
                      'TRIM': 'Atenuando Tensão Alta (Trim)',
                      'BOOST': 'Elevando Tensão Baixa (Boost)'
                  };
                  var clean = value.trim();
                  var parts = clean.split(/\s+/);
                  var res = [];
                  for (var i = 0; i < parts.length; i++) {
                      res.push(map[parts[i]] || parts[i]);
                  }
                  return res.join(' + ') + ' [' + clean + ']';
          description: |
            Significado dos códigos de status do NUT:
            - OL (On Line): Operando alimentado pela rede elétrica da concessionária.
            - OB (On Battery): Falta de energia. Operando a partir das baterias.
            - LB (Low Battery): Bateria em nível crítico (próximo do esgotamento).
            - RB (Replace Battery): Bateria desgastada / precisa ser trocada.
            - CHRG (Charging): Baterias sendo recarregadas.
            - BOOST / TRIM: Compensação de flutuação de tensão da rede.
          tags:
            - tag: Application
              value: Status
        - uuid: fa3cbe58a0884b0f946d549c0d863373
          name: 'UPS Status da Bateria'
          key: 'nut.battery_status_code[{$UPS_NAME}]'
          history: 7d
          trends: 180d
          valuemap:
            name: upsBatteryStatus
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 8681f38a725545b8842169bd9fad3e53
              expression: 'last(/Template Nobreak UPS NUT/nut.battery_status_code[{$UPS_NAME}])=3'
              name: 'UPS Bateria Muito Baixa para Suportar a Carga'
              priority: AVERAGE
        - uuid: fcc219d69bf54fd5b21c8d406dea2814
          name: 'UPS Indicador de Substituição da Bateria'
          key: 'nut.battery_replacement_code[{$UPS_NAME}]'
          history: 7d
          trends: 180d
          valuemap:
            name: upsBatteryReplacementStatus
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: a87477b99d014ff0bc2ad9e61426ac2a
              expression: 'last(/Template Nobreak UPS NUT/nut.battery_replacement_code[{$UPS_NAME}])<>1'
              name: 'UPS Bateria Requer Substituição'
              priority: AVERAGE
        - uuid: 965880f9a296497ba1164c6407036f2a
          name: 'UPS Capacidade da Bateria (%)'
          key: 'nut.get[{$UPS_NAME},battery.charge]'
          history: 7d
          value_type: FLOAT
          trends: 180d
          units: '%'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 17f65747368b4ecdbd90dba1d34b9491
              expression: 'last(/Template Nobreak UPS NUT/nut.get[{$UPS_NAME},battery.charge])<90'
              name: 'UPS Capacidade da Bateria Baixa (<90%)'
              priority: AVERAGE
            - uuid: 22e6ace095bf4b609b50f906943cb16c
              expression: 'last(/Template Nobreak UPS NUT/nut.get[{$UPS_NAME},battery.charge])<20'
              name: 'UPS Capacidade da Bateria Crítica (<20%)'
              priority: DISASTER
        - uuid: 681833070cd347c38dd10d0f1387d9aa
          name: 'UPS Limite Crítico de Bateria (%)'
          key: 'nut.get[{$UPS_NAME},battery.charge.low]'
          delay: 6h
          history: 7d
          value_type: FLOAT
          trends: 180d
          units: '%'
          tags:
            - tag: Application
              value: Power
        - uuid: b82d4048047b43fb90d1c9a2a876664c
          name: 'UPS Limite de Alerta de Bateria (%)'
          key: 'nut.get[{$UPS_NAME},battery.charge.warning]'
          delay: 6h
          history: 7d
          value_type: FLOAT
          trends: 180d
          units: '%'
          tags:
            - tag: Application
              value: Power
        - uuid: 2b738df50faa427689f27ff17877b73e
          name: 'UPS Autonomia Restante da Bateria'
          key: 'nut.get[{$UPS_NAME},battery.runtime]'
          history: 7d
          trends: 180d
          units: s
          tags:
            - tag: Application
              value: Power
        - uuid: 4288b422170d4fac83b68dc686215e50
          name: 'UPS Limite Crítico de Autonomia'
          key: 'nut.get[{$UPS_NAME},battery.runtime.low]'
          delay: 6h
          history: 7d
          trends: 180d
          units: s
          tags:
            - tag: Application
              value: Power
        - uuid: 804549f6ae33483e931893629e62137c
          name: 'UPS Tensão da Bateria'
          key: 'nut.get[{$UPS_NAME},battery.voltage]'
          history: 7d
          value_type: FLOAT
          trends: 180d
          units: V
          tags:
            - tag: Application
              value: Power
        - uuid: a3fedc26d1434551951a6c3c294f39cf
          name: 'UPS Tensão Nominal da Bateria'
          key: 'nut.get[{$UPS_NAME},battery.voltage.nominal]'
          delay: 6h
          history: 7d
          value_type: FLOAT
          trends: 180d
          units: V
          tags:
            - tag: Application
              value: Power
        - uuid: 43a0cb0e4ae44a32a64716ece827dc4d
          name: 'UPS Tipo de Bateria'
          key: 'nut.get[{$UPS_NAME},battery.type]'
          delay: 6h
          history: 7d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: Power
      valuemaps:
        - uuid: d97770757c794b818800594c15162652
          name: upsBatteryReplacementStatus
          mappings:
            - value: '1'
              newvalue: 'Normal / OK (noBatteryNeedsReplacing)'
            - value: '2'
              newvalue: 'Troca Necessária (batteryNeedsReplacing)'
        - uuid: 00aa8b8df74f481e8947d95ab93dbf76
          name: upsBatteryStatus
          mappings:
            - value: '1'
              newvalue: 'Desconhecido (unknown)'
            - value: '2'
              newvalue: 'Bateria Normal (batteryNormal)'
            - value: '3'
              newvalue: 'Bateria Baixa (batteryLow)'
        - uuid: c57440c6f6bd48a5a0f080d304b8c996
          name: upsStatus
          mappings:
            - value: '1'
              newvalue: 'Desconhecido (unknown)'
            - value: '2'
              newvalue: 'Operando na Rede Elétrica (onLine)'
            - value: '3'
              newvalue: 'Operando na Bateria (onBattery)'
            - value: '4'
              newvalue: 'Elevando Tensão Baixa (onSmartBoost)'
            - value: '5'
              newvalue: 'Espera Programada (timedSleeping)'
            - value: '6'
              newvalue: 'Bypass por Software (softwareBypass)'
            - value: '7'
              newvalue: 'Desligado (off)'
            - value: '8'
              newvalue: 'Reiniciando (rebooting)'
            - value: '9'
              newvalue: 'Bypass Chaveado (switchedBypass)'
            - value: '10'
              newvalue: 'Falha de Hardware em Bypass (hardwareFailureBypass)'
            - value: '11'
              newvalue: 'Retorno de Energia (sleepingUnitPowerReturn)'
            - value: '12'
              newvalue: 'Reduzindo Tensão Alta (onSmartTrim)'
            - value: '13'
              newvalue: 'Modo Econômico (ecoMode)'
            - value: '14'
              newvalue: 'Espera Ativa (hotStandby)'
            - value: '15'
              newvalue: 'Teste de Bateria (onBatteryTest)'
      macros:
        - macro: '{$UPS_NAME}'
          value: Cliente_Nobreak
          description: 'Nome do nobreak configurado no /etc/nut/ups.conf'
        - macro: '{$UPS_NOMINAL_POWER}'
          value: '2200'
          description: 'Potencia nominal do equipamento em Watts (opcional)'
      description: |
        Template universal para monitoramento de nobreaks (UPS) conectados via USB ou Serial utilizando Network UPS Tools (NUT) e Zabbix Agent 7.0 LTS.

        Compatível com as principais marcas e fabricantes do mercado (APC, SMS / Legrand, Eaton, CyberPower, Ragtech, Tripp-Lite, TS Shara, Riello, NHS, etc.).

        Consulte os modelos homologados e a lista oficial de compatibilidade de hardware (HCL) no site do NUT:
        https://networkupstools.org/stable-hcl.html
  triggers:
    - uuid: 38a64681ba904f25be3f1397e08dc6e0
      expression: |
        last(/Template Nobreak UPS NUT/nut.ups_status_code[{$UPS_NAME}])=3
        and
        last(/Template Nobreak UPS NUT/nut.get[{$UPS_NAME},battery.charge])>=0
      name: 'UPS em Modo Bateria (Falta de Energia)'
      opdata: 'Status: {ITEM.LASTVALUE1} | Carga Bateria: {ITEM.LASTVALUE2}%'
      priority: HIGH
      description: |
        O Nobreak passou a operar em modo Bateria (Queda ou interrupção no fornecimento de energia AC da concessionária).
        Status do Nobreak: {ITEM.LASTVALUE1}
        Nível de Carga da Bateria: {ITEM.LASTVALUE2}%
  graphs:
    - uuid: 5db6eb22e3d44264a26d49b0b1c69cfb
      name: 'UPS - Status Operacional e Bateria'
      ymin_type_1: FIXED
      graph_items:
        - drawtype: BOLD_LINE
          color: C80000
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.battery_status_code[{$UPS_NAME}]'
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: 00C800
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.battery_replacement_code[{$UPS_NAME}]'
        - sortorder: '2'
          drawtype: BOLD_LINE
          color: 0000CC
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.ups_status_code[{$UPS_NAME}]'
    - uuid: a038bcc748374a0a9aecca854ab94c6d
      name: 'UPS - Capacidade e Autonomia da Bateria'
      ymin_type_1: FIXED
      graph_items:
        - sortorder: '1'
          drawtype: FILLED_REGION
          color: 4CAF50
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.get[{$UPS_NAME},battery.charge]'
        - sortorder: '2'
          drawtype: BOLD_LINE
          color: CC0000
          yaxisside: RIGHT
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.get[{$UPS_NAME},battery.runtime]'
    - uuid: f3b9284795f54a9395c3ddd8a1d64a34
      name: 'UPS - Tensão da Bateria'
      graph_items:
        - color: 0000CC
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.get[{$UPS_NAME},battery.voltage]'
        - sortorder: '1'
          color: CC0000
          item:
            host: 'Template Nobreak UPS NUT'
            key: 'nut.get[{$UPS_NAME},battery.voltage.nominal]'
