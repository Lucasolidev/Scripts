zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: bf22fb76b4834395a72846c3dbb57e28
    template: Template Nobreak APC UPS NUT
    name: Template Nobreak APC UPS NUT (Zabbix Agent)
    groups:
    - name: Templates
    items:
    - uuid: 800ca3c5358e451c981135c5ac309465
      name: Contact
      key: nut.get[{},ups.mfr]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: CONTACT
      tags:
      - tag: Application
        value: System
    - uuid: 7622a2d657d2441cb785e506fd3c459b
      name: Software version (full)
      key: nut.get[{},driver.version]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: OS_FULL
      tags:
      - tag: Application
        value: System
    - uuid: 4e6d650b18b14487bb9c80b8198403de
      name: Device Location
      key: nut.get[{},device.type]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: LOCATION
      tags:
      - tag: Application
        value: System
    - uuid: 7adda8d504e244239bb24658045d1abe
      name: Device Name
      key: nut.get[{},ups.model]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      description: 'Bkp

        SNMPv2-MIB::sysName.0

        '
      inventory_link: NAME
      tags:
      - tag: Application
        value: System
    - uuid: dc75f27f77c8462f966bc8484ae99ce3
      name: System Uptime
      key: system.uptime
      history: 7d
      trends: 180d
      units: uptime
      description: 'Bkp

        SNMPv2-MIB::sysUpTime.0

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Status
    - uuid: bbd157bcb99d40f49b195d541687e538
      name: UPS battery capacity (%)
      key: nut.get[{},battery.charge]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: '%'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: f4b80a0d504649cf9899ac7f50668ed5
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvBatteryCapacity)<90
        name: Batery Capacity <90%
        priority: AVERAGE
    - uuid: 201953ce772342f2906bc28d21446d64
      name: UPS batery packst
      key: nut.get[{},battery.packs]
      delay: 1h
      history: 7d
      trends: 180d
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
    - uuid: f630a7b3d65b4243859e8a5b48ca03a1
      name: UPS battery temperature
      key: nut.get[{},battery.temperature]
      history: 7d
      trends: 180d
      units: °C
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 00fe5f37736841168a0cf29c1d9c6c1b
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvBatteryTemperature)>40
        name: High battery temperature
        priority: HIGH
    - uuid: f41f100278a3423eb7bced8971ec95fa
      name: UPS battery voltage
      key: nut.get[{},battery.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 69176a26ff174d549bca728fcdcddbc9
      name: Software version
      key: nut.get[{},ups.firmware]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: OS
      tags:
      - tag: Application
        value: System
    - uuid: 83e959eafa4a47358f49589d737fa7d9
      name: Device Serial Number
      key: nut.get[{},device.serial]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: SERIALNO_A
      tags:
      - tag: Application
        value: System
    - uuid: 47f628da794b426eb5bc5e7d57b31ff1
      name: UPS input frequency
      key: nut.get[{},input.frequency]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: Hz
      tags:
      - tag: Application
        value: Power
    - uuid: d7c8be281bb34b8ab4463f3a862d0f33
      name: UPS input voltage
      key: nut.get[{},input.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: d55b26504baa4ffe8fbab1f53e4796b0
      name: UPS current load (Amps)
      key: nut.load_amps[{},{}]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: amp
      tags:
      - tag: Application
        value: Power
    - uuid: e5067a69dbc64b47a77ae196d88edf73
      name: UPS output frequency
      key: nut.get[{},output.frequency]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: Hz
      tags:
      - tag: Application
        value: Power
    - uuid: 9186b3ef3b8a495d91619bdf8bdd1b64
      name: UPS output load (%)
      key: nut.get[{},ups.load]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: '%'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 467aca2f9bfa42a5929274a4fb0e0764
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvOutputLoad)>85
        name: Output Load Critical >85%
        priority: HIGH
      - uuid: 3c7495f90f8148e3abb87242cea5f6fd
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvOutputLoad)>90
        name: Output load High
        priority: WARNING
    - uuid: 6d8c5967f769462c8877d71c6c67b944
      name: UPS output load (W)
      key: nut.power_watts[{},{}]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: W
      params: last(//upsAdvOutputVoltage) * last(//upsAdvOutputCurrent)
      tags:
      - tag: Application
        value: Power
    - uuid: 89c6fcc4e2864cb68792c7b3e8bb87e2
      name: UPS output voltage
      key: nut.get[{},output.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 8f0df04340cc470f979c5ea366a63d53
      name: UPS replace battery indicator
      key: nut.battery_status_code[{}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcBatteryReplacementStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 65d9f190d159406199cf68d8ffa44811
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvReplaceBatteryIndicator)<>1
        name: Battery Needs Replaced
        priority: AVERAGE
    - uuid: 5f62862bd968450c906089add40336e0
      name: UPS battery time remaining
      key: nut.get[{},battery.runtime]
      history: 7d
      trends: 180d
      units: s
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 582608a242844da78ded1ee817ae2787
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvRunTimeRemaining)<20
        name: Batery Time Remaining <20min
        priority: HIGH
      - uuid: 048b7e84e5494b3286a7cf934abe4add
        expression: last(/Template Nobreak APC UPS SNMP/upsAdvRunTimeRemaining)<10
        name: Run time remaining CRITICAL
        priority: DISASTER
    - uuid: f546462c8be04e4f93df7afe846b4e91
      name: UPS battery status
      key: nut.battery_status_code[{}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcBatteryStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 68e94591eb0d4b2eae3a2339b1547223
        expression: last(/Template Nobreak APC UPS SNMP/upsBasicBatteryStatus)=3
        name: The battery power is too low to support the load
        priority: AVERAGE
    - uuid: 8b996eee530a423dab295321d04174f7
      name: UPS Time on Battery
      key: nut.get[{},battery.time_on_battery]
      history: 7d
      trends: 180d
      units: s
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
    - uuid: 15d96da88b214bb184334aa21d2fef18
      name: Device Model Name
      key: nut.get[{},device.model]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      inventory_link: TYPE
      tags:
      - tag: Application
        value: System
    - uuid: 684cd27e2a244d17860fa3cda44430ac
      name: UPS status
      key: nut.ups_status_code[{}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 1dd8b23a2dd64364b6b93b7d7bbb381b
        expression: last(/Template Nobreak APC UPS SNMP/upsBasicOutputStatus)<>2
        name: Nobreak Status
        priority: AVERAGE
    valuemaps:
    - uuid: 8fcce382d9424f0088a6a61c47e52b61
      name: apcBatteryReplacementStatus
      mappings:
      - value: '1'
        newvalue: noBatteryNeedsReplacing
      - value: '2'
        newvalue: batteryNeedsReplacing
    - uuid: f7faf728ad084253bfe7b3c67275e29e
      name: apcBatteryStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: batteryNormal
      - value: '3'
        newvalue: batteryLow
    - uuid: f21fd962ae984b6993a8ef1585382a8d
      name: apcStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: onLine
      - value: '3'
        newvalue: onBattery
      - value: '4'
        newvalue: onSmartBoost
      - value: '5'
        newvalue: timedSleeping
      - value: '6'
        newvalue: softwareBypass
      - value: '7'
        newvalue: 'off'
      - value: '8'
        newvalue: rebooting
      - value: '9'
        newvalue: switchedBypass
      - value: '10'
        newvalue: harwareFailureBypass
      - value: '11'
        newvalue: sleepingUnitPowerReturn
      - value: '12'
        newvalue: onSmartTrim
      - value: '13'
        newvalue: ecoMode
      - value: '14'
        newvalue: hotStandby
      - value: '15'
        newvalue: onBatteryTest
    description: Monitoramento universal de nobreaks APC e compativeis com NUT via Zabbix Agent 7.0.
    macros:
    - macro: '{}'
      value: Cliente_Nobreak
      description: Nome do nobreak configurado no /etc/nut/ups.conf
    - macro: '{}'
      value: '2200'
      description: Potencia nominal do nobreak em Watts
  triggers:
  - uuid: 6497cc36fc3245fd97b07d377e000921
    expression: 'last(/Template Nobreak APC UPS NUT/nut.get[{},battery.time_on_battery])>0

      and

      last(/Template Nobreak APC UPS NUT/nut.get[{},battery.runtime])>=0

      '
    name: Nobreak on Battery
    opdata: 'Operando: {ITEM.LASTVALUE1}  |  Restante: {ITEM.LASTVALUE2}'
    priority: HIGH
    description: "Operando: {ITEM.LASTVALUE1} \nRestante: {ITEM.LASTVALUE2}\n"
  graphs:
  - uuid: dd78f2814cee4649b72fec964872c340
    name: Battery status
    ymin_type_1: FIXED
    graph_items:
    - drawtype: BOLD_LINE
      color: C80000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.battery_status_code[{}]
    - sortorder: '1'
      drawtype: BOLD_LINE
      color: 00C800
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.battery_status_code[{}]
  - uuid: ebede932c9c441a0bf7dc0e6fd237178
    name: UPS Capacity
    ymin_type_1: FIXED
    graph_items:
    - sortorder: '1'
      drawtype: FILLED_REGION
      color: 4CAF50
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{},battery.charge]
    - sortorder: '2'
      drawtype: BOLD_LINE
      color: CC0000
      yaxisside: RIGHT
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{},battery.runtime]
  - uuid: 7d8e0d2a9cba47e19a132b86cc8b83e6
    name: UPS load
    graph_items:
    - color: C80000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.load_amps[{},{}]
    - sortorder: '1'
      color: 0000CC
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{},ups.load]
  - uuid: 720d2a068138434a9f29ea41413c6c1f
    name: UPS temperature
    ymin_type_1: FIXED
    graph_items:
    - drawtype: GRADIENT_LINE
      color: '660000'
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{},battery.temperature]
  - uuid: d986d1fa0f17462f96fe02bbfb8041e2
    name: UPS voltage
    graph_items:
    - color: 0000CC
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{},output.voltage]
    - sortorder: '1'
      color: CC0000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{},input.voltage]
