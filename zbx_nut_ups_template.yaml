zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: 10c88dfc48564d5292e5cba005de30b9
    template: Template Nobreak APC UPS NUT
    name: Template Nobreak APC UPS NUT (Zabbix Agent)
    groups:
    - name: Templates
    items:
    - uuid: 2cc8b43cfeb7429788f6fe3894c8d7bd
      name: Contact
      key: nut.get[{$UPS_NAME},ups.mfr]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: System
    - uuid: bb4167a492a64090aae98ecb72d1b7f4
      name: Software version (full)
      key: nut.get[{$UPS_NAME},driver.version]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: System
    - uuid: 68f6c06648424374b489224a144dc175
      name: Device Location
      key: nut.get[{$UPS_NAME},device.type]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: System
    - uuid: 5dc4b16422bf4205becb01d37488887f
      name: Device Name
      key: nut.get[{$UPS_NAME},ups.model]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      description: 'Bkp

        SNMPv2-MIB::sysName.0

        '
      tags:
      - tag: Application
        value: System
    - uuid: 965880f9a296497ba1164c6407036f2a
      name: UPS battery capacity (%)
      key: nut.get[{$UPS_NAME},battery.charge]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: '%'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 17f65747368b4ecdbd90dba1d34b9491
        expression: last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.charge])<90
        name: Batery Capacity <90%
        priority: AVERAGE
    - uuid: 35e54cc2641442c2b3e56f2ba0b65ec4
      name: UPS batery packst
      key: nut.get[{$UPS_NAME},battery.packs]
      delay: 1h
      history: 7d
      trends: 180d
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
    - uuid: 9fb2d1af20134c39ab0419f0df49bd2b
      name: UPS battery temperature
      key: nut.get[{$UPS_NAME},battery.temperature]
      history: 7d
      trends: 180d
      units: °C
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 23d8ff64a14243929b105598b26a8e86
        expression: last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.temperature])>40
        name: High battery temperature
        priority: HIGH
    - uuid: 804549f6ae33483e931893629e62137c
      name: UPS battery voltage
      key: nut.get[{$UPS_NAME},battery.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 69e95e8d71bf44cbb188c077b6da59fe
      name: Software version
      key: nut.get[{$UPS_NAME},ups.firmware]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: System
    - uuid: 9bb0079b79f448c6900e570f37e7a429
      name: Device Serial Number
      key: nut.get[{$UPS_NAME},device.serial]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: System
    - uuid: 9e7c6401a701484a9fd06404eacd7b8a
      name: UPS input frequency
      key: nut.get[{$UPS_NAME},input.frequency]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: Hz
      tags:
      - tag: Application
        value: Power
    - uuid: 2f79d76cecce4d8ab5c3779c847ababd
      name: UPS input voltage
      key: nut.get[{$UPS_NAME},input.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 6d1026f15d6645c8bdb46016c2e80fbe
      name: UPS current load (Amps)
      key: nut.load_amps[{$UPS_NAME},{$UPS_NOMINAL_POWER}]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: amp
      tags:
      - tag: Application
        value: Power
    - uuid: 06f4adc7c73048c8994c3a3e5a96e873
      name: UPS output frequency
      key: nut.get[{$UPS_NAME},output.frequency]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: Hz
      tags:
      - tag: Application
        value: Power
    - uuid: f2c5383f80ad44f598f605eabecc52f1
      name: UPS output load (%)
      key: nut.get[{$UPS_NAME},ups.load]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: '%'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 44e16e4aef6848b7ad5951414f9bfa71
        expression: last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},ups.load])>85
        name: Output Load Critical >85%
        priority: HIGH
      - uuid: 0efabd0cf9fd483b8af0dffa05a3cc55
        expression: last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},ups.load])>90
        name: Output load High
        priority: WARNING
    - uuid: fc0fc9e60da44b1f94fc3402fb19c527
      name: UPS output load (W)
      key: nut.power_watts[{$UPS_NAME},{$UPS_NOMINAL_POWER}]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: W
      tags:
      - tag: Application
        value: Power
    - uuid: 63b020ea500a440788857cbd4314c653
      name: UPS output voltage
      key: nut.get[{$UPS_NAME},output.voltage]
      history: 7d
      value_type: FLOAT
      trends: 180d
      units: VAC
      tags:
      - tag: Application
        value: Power
    - uuid: 2b738df50faa427689f27ff17877b73e
      name: UPS battery time remaining
      key: nut.get[{$UPS_NAME},battery.runtime]
      history: 7d
      trends: 180d
      units: s
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: f953c17275714534b889ffd997eb938e
        expression: last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.runtime])<20
        name: Batery Time Remaining <20min
        priority: HIGH
      - uuid: 5d6e0d7b5e1440249fd00916c52743d5
        expression: last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.runtime])<10
        name: Run time remaining CRITICAL
        priority: DISASTER
    - uuid: fa3cbe58a0884b0f946d549c0d863373
      name: UPS battery status
      key: nut.battery_status_code[{$UPS_NAME}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcBatteryStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 8681f38a725545b8842169bd9fad3e53
        expression: last(/Template Nobreak APC UPS NUT/nut.battery_status_code[{$UPS_NAME}])=3
        name: The battery power is too low to support the load
        priority: AVERAGE
      - uuid: a87477b99d014ff0bc2ad9e61426ac2a
        expression: last(/Template Nobreak APC UPS NUT/nut.battery_status_code[{$UPS_NAME}])=4
        name: Battery Needs Replaced
        priority: AVERAGE
    - uuid: 0ce0ea4922e540cba46c07145276adee
      name: UPS Time on Battery
      key: nut.get[{$UPS_NAME},battery.time_on_battery]
      history: 7d
      trends: 180d
      units: s
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: Application
        value: Power
    - uuid: c7b22775bc7e4db2a0cc62d0235c4a14
      name: Device Model Name
      key: nut.get[{$UPS_NAME},device.model]
      delay: 6h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: System
    - uuid: 6298635faaf946959721e34a6ad25d0b
      name: UPS status
      key: nut.ups_status_code[{$UPS_NAME}]
      history: 7d
      trends: 180d
      valuemap:
        name: apcStatus
      tags:
      - tag: Application
        value: Power
      triggers:
      - uuid: 8e9093235d6c4864bb318cccf21e442f
        expression: last(/Template Nobreak APC UPS NUT/nut.ups_status_code[{$UPS_NAME}])<>2
        name: Nobreak Status
        priority: AVERAGE
    valuemaps:
    - uuid: 00aa8b8df74f481e8947d95ab93dbf76
      name: apcBatteryStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: batteryNormal
      - value: '3'
        newvalue: batteryLow
      - value: '4'
        newvalue: batteryInFault
    - uuid: c57440c6f6bd48a5a0f080d304b8c996
      name: apcStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: onLine
      - value: '3'
        newvalue: onBattery
      - value: '4'
        newvalue: onSmartBoost
      - value: '5'
        newvalue: timedSleeping
      - value: '6'
        newvalue: softwareBypass
      - value: '7'
        newvalue: 'off'
      - value: '8'
        newvalue: rebooting
      - value: '9'
        newvalue: switchedBypass
      - value: '10'
        newvalue: harwareFailureBypass
      - value: '11'
        newvalue: sleepingUnitPowerReturn
      - value: '12'
        newvalue: onSmartTrim
      - value: '13'
        newvalue: ecoMode
      - value: '14'
        newvalue: hotStandby
      - value: '15'
        newvalue: onBatteryTest
    description: Monitoramento universal de nobreaks APC e compativeis com NUT via Zabbix Agent 7.0.
  triggers:
  - uuid: 38a64681ba904f25be3f1397e08dc6e0
    expression: 'last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.time_on_battery])>0

      and

      last(/Template Nobreak APC UPS NUT/nut.get[{$UPS_NAME},battery.runtime])>=0

      '
    name: Nobreak on Battery
    opdata: 'Operando: {ITEM.LASTVALUE1}  |  Restante: {ITEM.LASTVALUE2}'
    priority: HIGH
    description: "Operando: {ITEM.LASTVALUE1} \nRestante: {ITEM.LASTVALUE2}\n"
  graphs:
  - uuid: 5db6eb22e3d44264a26d49b0b1c69cfb
    name: Battery status
    ymin_type_1: FIXED
    graph_items:
    - drawtype: BOLD_LINE
      color: C80000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.battery_status_code[{$UPS_NAME}]
    - sortorder: '1'
      drawtype: BOLD_LINE
      color: 00C800
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.battery_status_code[{$UPS_NAME}]
  - uuid: a038bcc748374a0a9aecca854ab94c6d
    name: UPS Capacity
    ymin_type_1: FIXED
    graph_items:
    - sortorder: '1'
      drawtype: FILLED_REGION
      color: 4CAF50
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},battery.charge]
    - sortorder: '2'
      drawtype: BOLD_LINE
      color: CC0000
      yaxisside: RIGHT
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},battery.runtime]
  - uuid: 3c8bcf5355c34251bd8fd5a62572850f
    name: UPS load
    graph_items:
    - color: C80000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.load_amps[{$UPS_NAME},{$UPS_NOMINAL_POWER}]
    - sortorder: '1'
      color: 0000CC
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},ups.load]
  - uuid: fff86cf915f24ccbb42badb682979ee3
    name: UPS temperature
    ymin_type_1: FIXED
    graph_items:
    - drawtype: GRADIENT_LINE
      color: '660000'
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},battery.temperature]
  - uuid: f3b9284795f54a9395c3ddd8a1d64a34
    name: UPS voltage
    graph_items:
    - color: 0000CC
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},output.voltage]
    - sortorder: '1'
      color: CC0000
      item:
        host: Template Nobreak APC UPS NUT
        key: nut.get[{$UPS_NAME},input.voltage]
