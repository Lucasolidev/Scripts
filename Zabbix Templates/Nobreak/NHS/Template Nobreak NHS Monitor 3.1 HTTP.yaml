zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: a9e832821f614f3dbf0d9e2a1d2ef927
      template: Template Nobreak NHS Monitor 3.1 HTTP
      name: Template Nobreak NHS Monitor 3.1 (HTTP)
      description: |-
        Requisitos: exclusivamente NHS Nobreak Monitor 3.1 - Sistema de Monitoramento de Nobreaks em execução, com GET /status e GET /equipamento acessíveis ao servidor Zabbix ou ao proxy responsável pelo host. Não usar com NHS Nobreak Monitor 4.0 beta. A identificação NHS Nobreak Monitor 3.1 deve estar presente nas páginas. Usar Zabbix 7.0 e coletor com suporte a HTTP agent/libcurl.

        Configurar obrigatoriamente {$NHS.HTTP.URL} no host com a URL base do computador que executa o Monitor, incluindo protocolo e porta, sem barra final: http://<ip_do_computador>:2001. O padrão http://127.0.0.1:2001 só funciona quando o Monitor está no próprio coletor. Usar URL literal, sem outras macros dentro do valor. A coleta não exige interface Agent/SNMP nem Zabbix Agent ou UserParameter.

        Se o Monitor estiver em outro local, configurar acesso privado a partir do servidor ou selecionar um proxy Zabbix com acesso à rede do Monitor. localhost/127.0.0.1 refere-se ao servidor/proxy coletor, não ao computador remoto.

        {$NHS.HTTP.INTERVAL}: coleta de status, padrão 1m. {$NHS.HTTP.EQUIPMENT.INTERVAL}: configuração nominal, padrão 30m. {$NHS.HTTP.TIMEOUT}: timeout por GET, padrão 10s. {$NHS.HTTP.NODATA}: prazo sem status, padrão 5m. {$NHS.HTTP.EQUIPMENT.NODATA}: prazo sem equipamento, padrão 2h. Manter os prazos maiores que os respectivos intervalos.

        {$NHS.HTTP.LOAD.WARN}: carga elevada, padrão 85%. {$NHS.HTTP.LOAD.CRIT}: carga crítica, padrão 95%. {$NHS.HTTP.LOAD.HYST}: histerese, padrão 5 pontos percentuais. {$NHS.HTTP.PROBLEM.WINDOW}: janela de amostras dos alertas de carga, padrão 2m.

        {$NHS.HTTP.INPUT.OK.MATCHES}, {$NHS.HTTP.OUTPUT.OK.MATCHES} e {$NHS.HTTP.BATTERY.OK.MATCHES}: expressões regulares dos estados aceitos; padrões OK, Normal e Carregada, respectivamente. Ajustar apenas após conferir os textos e a semântica no equipamento.

        As páginas devem retornar HTTP 200 sem autenticação de sessão ou redirecionamento. Para URL HTTPS, o certificado e o nome do servidor devem ser confiáveis para o coletor. Nenhum outro template é obrigatório.
      vendor:
        name: Lucasolidev
        version: 7.0-4
      groups:
        - name: Templates
      items:
        - uuid: d59f3535e156412cb975c34fdc427d23
          name: 'NHS HTTP: Coleta Status atual'
          type: HTTP_AGENT
          key: nhs.http.status.get
          delay: '{$NHS.HTTP.INTERVAL}'
          history: 1d
          value_type: TEXT
          trends: '0'
          description: GET /status; converte as tabelas em JSON. Erros de layout ficam nos diagnósticos dependentes.
            Falhas HTTP tornam o item não suportado. Resposta HTTP recente não comprova comunicação serial/USB recente
            do nobreak.
          url: '{$NHS.HTTP.URL}/status'
          timeout: '{$NHS.HTTP.TIMEOUT}'
          status_codes: '200'
          follow_redirects: 'NO'
          retrieve_mode: BODY
          request_method: GET
          verify_peer: 'YES'
          verify_host: 'YES'
          tags:
            - tag: component
              value: collector
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var pageTitle = "Status atual";
                  var fields = [["Entrada", "Estado", "input_state", "input.state", "Estado da entrada", "CHAR", ""], ["Entrada", "Tensão de entrada", "input_voltage", "input.voltage", "Tensão de entrada", "FLOAT", "V"], ["Entrada", "Tensão de entrada mínima", "input_min", "input.voltage.min", "Tensão de entrada mínima registrada", "FLOAT", "V"], ["Entrada", "Tensão de entrada máxima", "input_max", "input.voltage.max", "Tensão de entrada máxima registrada", "FLOAT", "V"], ["Saída", "Estado", "output_state", "output.state", "Estado da saída", "CHAR", ""], ["Saída", "Tensão de saída", "output_voltage", "output.voltage", "Tensão de saída", "FLOAT", "V"], ["Saída", "Carga do nobreak", "output_load", "output.load", "Carga do nobreak", "FLOAT", "%"], ["Bateria", "Estado", "battery_state", "battery.state", "Estado da bateria", "CHAR", ""], ["Bateria", "Tensão da bateria", "battery_voltage", "battery.voltage", "Tensão da bateria", "FLOAT", "V"]];
                  // Parser restrito às tabelas de leitura do NHS Nobreak Monitor 3.1.
                  // O HTTP agent entrega o corpo convertido para UTF-8; não executar scripts do HTML.
                  var result = {ok: 0, error: '', data: {}};
                  function text(s) {
                      var entities = {nbsp:' ', amp:'&', lt:'<', gt:'>', quot:'"', apos:"'",
                          aacute:'á', eacute:'é', iacute:'í', oacute:'ó', uacute:'ú',
                          agrave:'à', acirc:'â', ecirc:'ê', ocirc:'ô', atilde:'ã', otilde:'õ', ccedil:'ç'};
                      return s.replace(/<[^>]*>/g, ' ').replace(/&(#x[0-9a-f]+|#[0-9]+|[a-z]+);/gi,
                          function(all, name) {
                              if (name.charAt(0) === '#') {
                                  var n = name.charAt(1).toLowerCase() === 'x' ?
                                      parseInt(name.slice(2), 16) : parseInt(name.slice(1), 10);
                                  return n > 0 && n <= 65535 ? String.fromCharCode(n) : all;
                              }
                              return Object.prototype.hasOwnProperty.call(entities, name.toLowerCase()) ?
                                  entities[name.toLowerCase()] : all;
                          }).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
                  }
                  function normalized(s) {
                      return text(s).toLowerCase().replace(/[áàâãä]/g,'a').replace(/[éèêë]/g,'e')
                          .replace(/[íìîï]/g,'i').replace(/[óòôõö]/g,'o').replace(/[úùûü]/g,'u')
                          .replace(/ç/g,'c').replace(/\s*:\s*$/,'');
                  }
                  function fail(message) { throw {nhsParserError: message}; }
                  try {
                      var html = value.replace(/<!--[\s\S]*?-->/g, '')
                          .replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, '');
                      if (!/NHS\s+Nobreak\s+Monitor\s+3\.1\s*-/i.test(text(html)))
                          fail('Versão incompatível ou identificação ausente: requer NHS Nobreak Monitor 3.1.');
                      var content = /<div\b[^>]*\bid\s*=\s*["']content["'][^>]*>([\s\S]*?)<\/div\s*>/i.exec(html);
                      if (!content) fail('Bloco de conteúdo NHS ausente.');
                      var title = /<h1\b[^>]*>([\s\S]*?)<\/h1\s*>/i.exec(content[1]);
                      if (!title || normalized(title[1]) !== normalized(pageTitle))
                          fail('Página recebida não corresponde à página de leitura esperada.');
                      var tables = {}, tableRe = /<table\b[^>]*>([\s\S]*?)<\/table\s*>/gi, match;
                      while ((match = tableRe.exec(content[1])) !== null) {
                          var header = /<thead\b[^>]*>([\s\S]*?)<\/thead\s*>/i.exec(match[1]);
                          var body = /<tbody\b[^>]*>([\s\S]*?)<\/tbody\s*>/i.exec(match[1]);
                          if (!header || !body) continue;
                          var section = normalized(header[1]);
                          if (Object.prototype.hasOwnProperty.call(tables, section))
                              fail('Seção duplicada na página NHS.');
                          tables[section] = {};
                          var rowRe = /<tr\b[^>]*>([\s\S]*?)<\/tr\s*>/gi, row;
                          while ((row = rowRe.exec(body[1])) !== null) {
                              var cellRe = /<td\b[^>]*>([\s\S]*?)<\/td\s*>/gi, cells = [], cell;
                              while ((cell = cellRe.exec(row[1])) !== null) cells.push(cell[1]);
                              if (cells.length !== 2) continue;
                              var label = normalized(cells[0]);
                              if (Object.prototype.hasOwnProperty.call(tables[section], label))
                                  fail('Rótulo duplicado na página NHS.');
                              tables[section][label] = text(cells[1]);
                          }
                      }
                      var data = {};
                      for (var i = 0; i < fields.length; i++) {
                          var f = fields[i], sec = normalized(f[0]), lab = normalized(f[1]);
                          if (!Object.prototype.hasOwnProperty.call(tables, sec) ||
                              !Object.prototype.hasOwnProperty.call(tables[sec], lab))
                              fail('Campo ausente: ' + f[0] + ' / ' + f[1] + '.');
                          var raw = tables[sec][lab];
                          if (!raw || raw.length > 255) fail('Campo vazio ou inválido: ' + f[1] + '.');
                          if (f[5] === 'CHAR') {
                              data[f[2]] = raw;
                          } else {
                              var number = /^([+-]?\d+(?:[.,]\d+)?)\s*(V|%)?$/.exec(raw);
                              if (!number || (number[2] || '') !== f[6])
                                  fail('Número ou unidade inválidos: ' + f[1] + '.');
                              var n = Number(number[1].replace(',', '.'));
                              if (!isFinite(n) || n < 0 || (f[5] === 'UNSIGNED' && Math.floor(n) !== n))
                                  fail('Valor numérico inválido: ' + f[1] + '.');
                              data[f[2]] = n;
                          }
                      }
                      result.data = data;
                      result.ok = 1;
                  } catch (e) {
                      // Somente diagnósticos definidos pelo parser, sem HTML ou exceções externas.
                      result.error = e && typeof e.nhsParserError === 'string' ?
                          e.nhsParserError : 'Falha de interpretação da página NHS.';
                  }
                  return JSON.stringify(result);
