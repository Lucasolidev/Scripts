                      var html = value.replace(/<!--[\s\S]*?-->/g, '')
                          .replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, '');
                      if (!/NHS\s+Nobreak\s+Monitor\s+3\.1\s*-/i.test(text(html)))
                          fail('Versão incompatível ou identificação ausente: requer NHS Nobreak Monitor 3.1.');
                      var content = /<div\b[^>]*\bid\s*=\s*["']content["'][^>]*>([\s\S]*?)<\/div\s*>/i.exec(html);
                      if (!content) fail('Bloco de conteúdo NHS ausente.');
                      var title = /<h1\b[^>]*>([\s\S]*?)<\/h1\s*>/i.exec(content[1]);
                      if (!title || normalized(title[1]) !== normalized(pageTitle))
                          fail('Página recebida não corresponde à página de leitura esperada.');
                      var tables = {}, tableRe = /<table\b[^>]*>([\s\S]*?)<\/table\s*>/gi, match;
                      while ((match = tableRe.exec(content[1])) !== null) {
                          var header = /<thead\b[^>]*>([\s\S]*?)<\/thead\s*>/i.exec(match[1]);
                          var body = /<tbody\b[^>]*>([\s\S]*?)<\/tbody\s*>/i.exec(match[1]);
                          if (!header || !body) continue;
                          var section = normalized(header[1]);
                          if (Object.prototype.hasOwnProperty.call(tables, section))
                              fail('Seção duplicada na página NHS.');
                          tables[section] = {};
                          var rowRe = /<tr\b[^>]*>([\s\S]*?)<\/tr\s*>/gi, row;
                          while ((row = rowRe.exec(body[1])) !== null) {
                              var cellRe = /<td\b[^>]*>([\s\S]*?)<\/td\s*>/gi, cells = [], cell;
                              while ((cell = cellRe.exec(row[1])) !== null) cells.push(cell[1]);
                              if (cells.length !== 2) continue;
                              var label = normalized(cells[0]);
                              if (Object.prototype.hasOwnProperty.call(tables[section], label))
                                  fail('Rótulo duplicado na página NHS.');
                              tables[section][label] = text(cells[1]);
                          }
                      }
                      var data = {};
                      for (var i = 0; i < fields.length; i++) {
                          var f = fields[i], sec = normalized(f[0]), lab = normalized(f[1]);
                          if (!Object.prototype.hasOwnProperty.call(tables, sec) ||
                              !Object.prototype.hasOwnProperty.call(tables[sec], lab))
                              fail('Campo ausente: ' + f[0] + ' / ' + f[1] + '.');
                          var raw = tables[sec][lab];
                          if (!raw || raw.length > 255) fail('Campo vazio ou inválido: ' + f[1] + '.');
                          if (f[5] === 'CHAR') {
                              data[f[2]] = raw;
                          } else {
                              var number = /^([+-]?\d+(?:[.,]\d+)?)\s*(V|%)?$/.exec(raw);
                              if (!number || (number[2] || '') !== f[6])
                                  fail('Número ou unidade inválidos: ' + f[1] + '.');
                              var n = Number(number[1].replace(',', '.'));
                              if (!isFinite(n) || n < 0 || (f[5] === 'UNSIGNED' && Math.floor(n) !== n))
                                  fail('Valor numérico inválido: ' + f[1] + '.');
