zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: b96e6d922317424a8f936a3c87e27c52
    template: Template Nobreak NHS SNMP
    name: Template Nobreak NHS (SNMP)
    description: |-
      Monitoramento de nobreak NHS com módulo Ethernet, por consultas SNMP diretas à UPS-MIB RFC 1628.

      Formato de exportação Zabbix 7.0; use servidor e proxy compatíveis.

      Configuração obrigatória no HOST: criar {$SNMP_COMMUNITY} com a comunidade autorizada, preferencialmente como Secret text.

      Na interface SNMP do host, selecionar SNMPv2 (versão 2), porta 161 e preencher SNMP community com {$SNMP_COMMUNITY}.
    vendor:
      name: Lucasolidev
      version: 7.0-2
    groups:
    - name: Templates
    templates:
    - name: Template ICMP
    items:
    - uuid: 770b1f7325dd4440940180d6e1a5890b
      name: 'NHS: Contato'
      type: SNMP_AGENT
      key: nhs.system.contact
      delay: '{$NHS.POLL.INTERVAL}'
      history: 7d
      value_type: CHAR
      description: 'Objeto sysContact; OID 1.3.6.1.2.1.1.4.0. '
      tags:
      - tag: component
        value: system
      trends: '0'
      snmp_oid: 1.3.6.1.2.1.1.4.0
    - uuid: 3536f2463b354f42a75d937ed219fb59
