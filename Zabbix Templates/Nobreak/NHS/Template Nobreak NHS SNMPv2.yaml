      delay: '{$NHS.POLL.INTERVAL}'
      history: 7d
      value_type: CHAR
      description: Objeto sysDescr; OID 1.3.6.1.2.1.1.1.0. sysDescr descreve o agente SNMP, não necessariamente a versão do
        firmware do nobreak.
      tags:
