      - value: '7'
        newvalue: Reduzindo tensão (AVR)
    - uuid: a2b3c4991ecb4f6e8eefde3f0e02c561
      name: NHS UPS test result
      mappings:
      - value: '1'
        newvalue: Aprovado
      - value: '2'
