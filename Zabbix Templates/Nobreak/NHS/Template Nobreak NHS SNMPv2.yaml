    - uuid: 18fdaacdff7d4982ac82af5713b26635
      name: 'NHS: Autonomia estimada restante'
      type: SNMP_AGENT
      key: nhs.ups.battery.runtime
      delay: '{$NHS.POLL.INTERVAL}'
      history: 7d
      value_type: FLOAT
      description: Objeto upsEstimatedMinutesRemaining; OID 1.3.6.1.2.1.33.1.2.3.0. RFC 1628 fornece minutos. 999 não é sentinela
        definida pela MIB; confirme com o fabricante antes de filtrar. Macros de autonomia também usam minutos.
      preprocessing:
      - type: IN_RANGE
        parameters:
        - '0'
        - ''
      - type: JAVASCRIPT
        parameters:
        - |-
          var sentinel = Number('{$NHS.RUNTIME.UNKNOWN}');
          if (!isFinite(sentinel) || sentinel < 0) { throw 'Macro NHS.RUNTIME.UNKNOWN inválida'; }
          if (sentinel > 0 && Number(value) === sentinel) { throw 'Autonomia não informada pelo firmware (sentinela configurada)'; }
          return value;
      tags:
      - tag: component
        value: battery
      trends: 90d
      units: '!min'
      snmp_oid: 1.3.6.1.2.1.33.1.2.3.0
