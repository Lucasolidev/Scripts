        name: 'NHS: Sem coleta SNMP da placa'
        opdata: Consultar estado do item Uptime da placa SNMP
        priority: AVERAGE
        description: Sem amostra recente de sysUpTime da placa. Verificar rede, UDP/161, versão, comunidade e processos do
          servidor/proxy. Não comprova que o nobreak está desligado.
