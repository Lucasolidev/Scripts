  triggers:
  - uuid: dd989dd5d16a4eba860f0d231a40d20a
    expression: (nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.charge,{$NHS.NODATA})=1 or nodata(/Template Nobreak NHS
      SNMP/nhs.ups.input.voltage,{$NHS.NODATA})=1 or nodata(/Template Nobreak NHS SNMP/nhs.ups.output.voltage,{$NHS.NODATA})=1
      or nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=1) and nodata(/Template Nobreak NHS SNMP/nhs.system.uptime,{$NHS.NODATA})=0
    name: 'NHS: Sem coleta de medições essenciais do nobreak'
    opdata: Conferir os itens de carga da bateria, tensões e fonte da saída
    priority: AVERAGE
    description: A placa responde via sysUpTime, mas carga da bateria, tensão de entrada/saída ou fonte da saída não possuem
      dados recentes. Conferir individualmente esses itens, índice e comunicação da placa com o nobreak.
    tags:
    - tag: component
      value: availability
    dependencies:
    - name: 'NHS: Sem coleta SNMP da placa'
      expression: nodata(/Template Nobreak NHS SNMP/nhs.system.uptime,{$NHS.NODATA})=1
  - uuid: b8649627530e456583619e5667b1d414
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.on_battery)=1 and nodata(/Template Nobreak NHS SNMP/nhs.ups.on_battery,{$NHS.NODATA})=0
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.seconds,{$NHS.NODATA})=0
    name: 'NHS: Operando em bateria'
    opdata: 'Operando em bateria: {ITEM.LASTVALUE1}'
    priority: WARNING
    description: Identificado pela fonte da saída ou pelo tempo em bateria, ambos confirmados na resposta SNMP. Não depende
      da tabela de alarmes.
    tags:
    - tag: component
      value: on_battery
  - uuid: c5082bb85d714cf49d0aec5037abe715
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.battery.status)=3 and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.status,{$NHS.NODATA})=0
    name: 'NHS: Bateria baixa'
    opdata: '{ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: Estado batteryLow(3) reportado pela UPS-MIB.
    tags:
    - tag: component
      value: battery
  - uuid: 4e0aef33eb37439eb3631199fcbd50c3
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.battery.status)=4 and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.status,{$NHS.NODATA})=0
    name: 'NHS: Bateria esgotada'
    opdata: '{ITEM.LASTVALUE1}'
    priority: DISASTER
    description: 'Estado batteryDepleted(4): a bateria não sustenta a carga quando faltar energia.'
    tags:
    - tag: component
      value: battery
  - uuid: b07591ae892c431a92f9932621adf76f
    expression: min(/Template Nobreak NHS SNMP/nhs.ups.battery.status,5m)=1 and max(/Template Nobreak NHS SNMP/nhs.ups.battery.status,5m)=1
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.status,{$NHS.NODATA})=0
    name: 'NHS: Estado da bateria desconhecido'
    opdata: '{ITEM.LASTVALUE1}'
    priority: WARNING
    description: Estado unknown(1) persistente. Conferir comunicação e firmware.
    tags:
    - tag: component
      value: battery
  - uuid: 8d1f22bb652341bba5a494982613d091
    expression: max(/Template Nobreak NHS SNMP/nhs.ups.battery.charge,5m)<{$NHS.BATTERY.CHARGE.MIN} and nodata(/Template Nobreak
      NHS SNMP/nhs.ups.battery.charge,{$NHS.NODATA})=0
    name: 'NHS: Carga da bateria abaixo de {$NHS.BATTERY.CHARGE.MIN}%'
    opdata: '{ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: Alerta sustentado por cinco minutos; recuperação com histerese configurável.
    tags:
    - tag: component
      value: battery
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/Template Nobreak NHS SNMP/nhs.ups.battery.charge)>={$NHS.BATTERY.CHARGE.RECOVERY} and nodata(/Template
      Nobreak NHS SNMP/nhs.ups.battery.charge,{$NHS.NODATA})=0
  - uuid: c80e1a3c0a7e4bd8a9121c0be3a6a878
    expression: min(/Template Nobreak NHS SNMP/nhs.ups.battery.temperature,3m)>{$NHS.BATTERY.TEMP.MAX} and nodata(/Template
      Nobreak NHS SNMP/nhs.ups.battery.temperature,{$NHS.NODATA})=0
    name: 'NHS: Temperatura da bateria elevada'
    opdata: '{ITEM.LASTVALUE1}'
    priority: HIGH
    description: Necessita sensor e leitura válida. Zero não garante temperatura normal se o modelo não possuir sensor.
    tags:
    - tag: component
      value: battery
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/Template Nobreak NHS SNMP/nhs.ups.battery.temperature)<({$NHS.BATTERY.TEMP.MAX}-{$NHS.BATTERY.TEMP.HYST})
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.temperature,{$NHS.NODATA})=0
  - uuid: a9a7c31332e74adaabf8d98bce8fd666
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.battery.runtime)<{$NHS.RUNTIME.CRIT} and last(/Template Nobreak NHS
      SNMP/nhs.ups.on_battery)=1 and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.runtime,{$NHS.NODATA})=0 and nodata(/Template
      Nobreak NHS SNMP/nhs.ups.on_battery,{$NHS.NODATA})=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=0
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.seconds,{$NHS.NODATA})=0
    name: 'NHS: Autonomia crítica em bateria'
    opdata: '{ITEM.LASTVALUE1}'
    priority: DISASTER
    description: Autonomia em minutos. Faixas mutuamente exclusivas; somente em bateria e com autonomia recente.
    tags:
    - tag: component
      value: battery
  - uuid: 32ac58f276b442a0895df7305972a966
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.battery.runtime)<{$NHS.RUNTIME.HIGH} and last(/Template Nobreak NHS
      SNMP/nhs.ups.battery.runtime)>={$NHS.RUNTIME.CRIT} and last(/Template Nobreak NHS SNMP/nhs.ups.on_battery)=1 and nodata(/Template
      Nobreak NHS SNMP/nhs.ups.battery.runtime,{$NHS.NODATA})=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.on_battery,{$NHS.NODATA})=0
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.seconds,{$NHS.NODATA})=0
    name: 'NHS: Autonomia baixa em bateria'
    opdata: '{ITEM.LASTVALUE1}'
    priority: HIGH
    description: Autonomia em minutos. Faixas mutuamente exclusivas; somente em bateria e com autonomia recente.
    tags:
    - tag: component
      value: battery
  - uuid: ff1903aa21a641aab6b2b438be576a95
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.on_battery)=1 and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.runtime,{$NHS.NODATA})=1
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.on_battery,{$NHS.NODATA})=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=0
      and nodata(/Template Nobreak NHS SNMP/nhs.ups.battery.seconds,{$NHS.NODATA})=0
    name: 'NHS: Autonomia indisponível durante operação em bateria'
    opdata: '{ITEM.LASTVALUE1}'
    priority: WARNING
    description: O nobreak está em bateria e a autonomia não está sendo atualizada, inclusive quando há sentinela configurada.
      Não é possível estimar o tempo até desligamento.
    tags:
    - tag: component
      value: battery
  - uuid: 85a283db10624d66b7a93cb452f6a958
    expression: max(/Template Nobreak NHS SNMP/nhs.ups.input.voltage,2m)=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.input.voltage,{$NHS.NODATA})=0
    name: 'NHS: Sem tensão de entrada'
    opdata: '{ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: Entrada em zero por dois minutos. Confirmar ausência de rede na interface do nobreak.
    tags:
    - tag: component
      value: input
  - uuid: 17c6ef7ce8a94ac2964d29b2678989f7
    expression: max(/Template Nobreak NHS SNMP/nhs.ups.output.voltage,2m)=0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.voltage,{$NHS.NODATA})=0
    name: 'NHS: Saída sem tensão'
    opdata: '{ITEM.LASTVALUE1}'
    priority: DISASTER
    description: Saída em zero por dois minutos. Pode indicar que a carga deixou de receber energia; conferir equipamento
      e leitura.
    tags:
    - tag: component
      value: output
  - uuid: 27de0d895cb04fb186094cdc9ad4779b
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.output.load)>={$NHS.OUTPUT.LOAD.CRIT} and nodata(/Template Nobreak
      NHS SNMP/nhs.ups.output.load,{$NHS.NODATA})=0
    name: 'NHS: Carga de saída crítica'
    opdata: '{ITEM.LASTVALUE1}'
    priority: HIGH
    description: Faixas mutuamente exclusivas. Ajustar limites às especificações do modelo.
    tags:
    - tag: component
      value: output
  - uuid: 774ff3bcfdc84d6cbc63ef08dcfa6998
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.output.load)>={$NHS.OUTPUT.LOAD.WARN} and last(/Template Nobreak NHS
      SNMP/nhs.ups.output.load)<{$NHS.OUTPUT.LOAD.CRIT} and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.load,{$NHS.NODATA})=0
    name: 'NHS: Carga de saída elevada'
    opdata: '{ITEM.LASTVALUE1}'
    priority: WARNING
    description: Faixas mutuamente exclusivas. Ajustar limites às especificações do modelo.
    tags:
    - tag: component
      value: output
  - uuid: 76b9511b9b7b42e590ecab4bf5302db7
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.output.source)=2 and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=0
    name: 'NHS: Fonte da saída indica ausência de energia'
    opdata: '{ITEM.LASTVALUE1}'
    priority: DISASTER
    description: Estado informado por upsOutputSource. Booster(6) e reducer(7) são regulação de tensão e não são tratados
      como falta de rede.
    tags:
    - tag: component
      value: output
  - uuid: c4ea5f26a3e740a3883d64e63213ed32
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.output.source)=4 and nodata(/Template Nobreak NHS SNMP/nhs.ups.output.source,{$NHS.NODATA})=0
    name: 'NHS: Operando em bypass'
    opdata: '{ITEM.LASTVALUE1}'
    priority: WARNING
    description: Estado informado por upsOutputSource. Booster(6) e reducer(7) são regulação de tensão e não são tratados
      como falta de rede.
    tags:
    - tag: component
      value: output
  - uuid: fb1082ce719046c8b9193b224190ba33
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.alarms.count)>0 and nodata(/Template Nobreak NHS SNMP/nhs.ups.alarms.count,{$NHS.NODATA})=0
    name: 'NHS: Nobreak informa alarmes ativos'
    opdata: '{ITEM.LASTVALUE1}'
    priority: WARNING
    description: Contagem upsAlarmsPresent maior que zero. Consultar a interface web do nobreak para identificar os alarmes;
      a resposta fornecida não contém linhas da tabela de alarmes e não permite identificar troca de bateria ou desligamento
      iminente.
    tags:
    - tag: component
      value: alarms
  - uuid: 8b33e8d0cfd349fc9f06ea98b17de999
    expression: last(/Template Nobreak NHS SNMP/nhs.ups.test.result)=3 and nodata(/Template Nobreak NHS SNMP/nhs.ups.test.result,{$NHS.NODATA})=0
    name: 'NHS: Último autoteste terminou com erro'
    opdata: '{ITEM.LASTVALUE1}'
    priority: AVERAGE
    description: Resultado doneError(3). O template apenas consulta o último teste realizado pelo equipamento.
    tags:
    - tag: component
      value: test
