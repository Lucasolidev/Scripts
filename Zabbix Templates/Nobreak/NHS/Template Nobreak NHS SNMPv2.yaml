      snmp_oid: 1.3.6.1.2.1.33.1.9.6.0
    - uuid: 4f1e56cf5b20410ab605ff36b567d19c
      name: 'NHS: Potência aparente de saída (V × A)'
      type: CALCULATED
      key: nhs.ups.output.apparent_power
      delay: '{$NHS.POLL.INTERVAL}'
      history: 7d
      trends: 90d
      value_type: FLOAT
      tags:
      - tag: component
        value: power
      units: VA
      description: Potência aparente calculada em VA a partir das últimas leituras de tensão e corrente da saída. Consultas
        independentes podem ocorrer em instantes diferentes. Sem dados recentes de ambas, o cálculo fica indisponível por
        divisão por zero; não transforma falta de dados em potência zero.
      params: last(//nhs.ups.output.voltage)*last(//nhs.ups.output.current)/((nodata(//nhs.ups.output.voltage,{$NHS.NODATA})=0)
        and (nodata(//nhs.ups.output.current,{$NHS.NODATA})=0))
    - uuid: ce18893cbdc9480e9d5392e7baa0e6a1
      name: 'NHS: Operando em bateria'
      type: CALCULATED
      key: nhs.ups.on_battery
      delay: '{$NHS.POLL.INTERVAL}'
      history: 7d
      trends: 90d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: battery
      description: 'Indicador calculado: Sim quando a fonte da saída é bateria (5) ou o tempo em bateria é maior que zero.
        Exige ambas as medições recentes; sem elas o cálculo fica indisponível, sem assumir estado normal. O cálculo pode
        atualizar depois dos itens SNMP.'
      valuemap:
        name: NHS boolean
      params: (last(//nhs.ups.output.source)=5 or last(//nhs.ups.battery.seconds)>0)/((nodata(//nhs.ups.output.source,{$NHS.NODATA})=0)
        and (nodata(//nhs.ups.battery.seconds,{$NHS.NODATA})=0))
    tags:
    - tag: class
      value: power
    - tag: target
      value: nhs
    macros:
    - macro: '{$NHS.POLL.INTERVAL}'
      value: 1m
      description: Intervalo das consultas SNMP diretas e dos dois itens calculados.
    - macro: '{$NHS.INPUT.INDEX}'
      value: '1'
      description: Índice da linha de entrada na UPS-MIB; confirmar nos dados brutos.
    - macro: '{$NHS.OUTPUT.INDEX}'
      value: '1'
      description: Índice da linha de saída na UPS-MIB; confirmar nos dados brutos.
    - macro: '{$NHS.NODATA}'
      value: 5m
      description: Janela de ausência de dados. Deve ser maior que POLL.INTERVAL.
    - macro: '{$NHS.BATTERY.CHARGE.MIN}'
      value: '90'
      description: Carga mínima em %. Alerta após cinco minutos abaixo do limite.
    - macro: '{$NHS.BATTERY.CHARGE.RECOVERY}'
      value: '95'
      description: Carga em % para recuperar o alerta; deve ser maior que CHARGE.MIN.
    - macro: '{$NHS.BATTERY.TEMP.MAX}'
      value: '40'
      description: Temperatura máxima em °C; ajustar conforme fabricante e sensor.
    - macro: '{$NHS.BATTERY.TEMP.HYST}'
      value: '2'
      description: Histerese em °C para recuperação do alerta de temperatura.
    - macro: '{$NHS.RUNTIME.HIGH}'
      value: '20'
      description: Autonomia baixa em minutos, somente operando em bateria. Deve ser maior que RUNTIME.CRIT.
    - macro: '{$NHS.RUNTIME.CRIT}'
      value: '10'
      description: Autonomia crítica em minutos, somente operando em bateria.
    - macro: '{$NHS.RUNTIME.UNKNOWN}'
      value: '0'
      description: 0 desativa o filtro. Configurar 999 somente após confirmação de que o firmware usa esse valor como autonomia
        desconhecida.
    - macro: '{$NHS.OUTPUT.LOAD.WARN}'
      value: '85'
      description: Carga de saída em % para aviso; deve ser menor que LOAD.CRIT.
    - macro: '{$NHS.OUTPUT.LOAD.CRIT}'
      value: '95'
      description: Carga de saída em % para alerta crítico.
    valuemaps:
    - uuid: 7abf29932b424614a2ced978c3970d8d
      name: NHS UPS battery status
      mappings:
      - value: '1'
        newvalue: Estado desconhecido
      - value: '2'
        newvalue: Bateria normal
      - value: '3'
        newvalue: Bateria baixa
      - value: '4'
        newvalue: Bateria esgotada
    - uuid: fc2910ba66114a87b0032e391b489aa2
      name: NHS UPS output source
      mappings:
      - value: '1'
        newvalue: Outro/desconhecido
      - value: '2'
        newvalue: Sem fonte de saída
      - value: '3'
        newvalue: Rede normal
      - value: '4'
        newvalue: Bypass
      - value: '5'
        newvalue: Bateria
      - value: '6'
